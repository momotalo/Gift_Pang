<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Heart</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body
    class="bg-gradient-to-br from-pink-200 to-pink-300 min-h-screen flex items-center justify-center p-6 overflow-hidden">

    <!-- Back Button -->
    <a href="menu.html" class="absolute top-6 left-6 bg-white text-pink-600 px-5 py-2 rounded-full shadow-md 
            hover:bg-pink-500 hover:text-white transition duration-300 flex items-center gap-2">

        <!-- Arrow Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>

        Back
    </a>

    <div class="max-w-4xl w-full px-6">

        <!-- Window -->
        <div class="w-full max-w-6xl bg-white rounded-xl shadow-2xl overflow-hidden">

            <!-- Top Bar -->
            <div class="bg-pink-500 text-white px-4 py-2 flex justify-between items-center">
                <span>💗 My Heart</span>
                <span class="text-sm">Ready</span>
            </div>

            <!-- Address + Back -->
            <div class="bg-pink-100 px-4 py-2 flex items-center gap-4 text-sm">

                <!-- Back Button -->
                <button onclick="goBack()"
                    class="bg-white px-3 py-1 rounded shadow hover:bg-pink-400 hover:text-white transition">
                    ← Back
                </button>

                <span id="addressBar" class="text-gray-600">
                    C:\Users\Love\
                </span>

            </div>

            <!-- Content -->
            <div id="explorer" class="p-8 h-[600px] flex items-center justify-center">
                <div class="cursor-pointer text-lg" onclick="openFolder(1)">
                    📁 รูปภาพของเรา
                </div>
            </div>

        </div>

        <!-- Image Modal -->
        <div id="imageModal" class="fixed inset-0 bg-black/0 opacity-0 invisible
            flex items-center justify-center
            transition-all duration-500 ease-out z-50">

            <img id="modalImg" class="max-w-[70%] max-h-[80%]
                rounded-xl shadow-2xl
                scale-75 opacity-0
                transition-all duration-500 ease-out">
        </div>

        <script src="./script.js"></script>

</body>

</html>
