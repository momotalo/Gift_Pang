<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Our Anniversary</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-pink-50 min-h-screen flex items-center justify-center">

    <!-- Back Button -->
    <a href="menu.html" class="absolute top-6 left-6 bg-white text-pink-600 px-5 py-2 rounded-full shadow-md 
            hover:bg-pink-500 hover:text-white transition duration-300 flex items-center gap-2">

        <!-- Arrow Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>

        Back
    </a>

    <div class="bg-white shadow-2xl rounded-3xl p-10 w-[380px] relative">

        <!-- Title -->
        <div class="text-center mb-6">
            <div class="text-4xl mb-2">🎀</div>
            <h1 class="text-2xl font-bold text-gray-800">Our Anniversary</h1>
            <p class="text-gray-500 text-sm mt-1">What date is our anniversary?</p>
        </div>

        <!-- Password Display -->
        <div class="border-2 border-pink-300 rounded-xl p-4 text-center text-2xl tracking-[10px] mb-6">
            <span id="display">----</span>
        </div>

        <!-- Keypad -->
        <div class="grid grid-cols-3 gap-4">
            <button onclick="press(1)" class="btn">1</button>
            <button onclick="press(2)" class="btn">2</button>
            <button onclick="press(3)" class="btn">3</button>
            <button onclick="press(4)" class="btn">4</button>
            <button onclick="press(5)" class="btn">5</button>
            <button onclick="press(6)" class="btn">6</button>
            <button onclick="press(7)" class="btn">7</button>
            <button onclick="press(8)" class="btn">8</button>
            <button onclick="press(9)" class="btn">9</button>
            <button onclick="clearOne()" class="btn">⌫</button>
            <button onclick="press(0)" class="btn">0</button>
            <button onclick="clearAll()" class="btn">C</button>
        </div>

        <!-- Loading Overlay -->
        <div id="loading" class="absolute inset-0 bg-white/90 hidden items-center justify-center rounded-3xl">

            <div class="w-12 h-12 border-4 border-pink-400 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-pink-500 font-semibold">Loading...</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
