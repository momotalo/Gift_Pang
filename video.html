<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Back Button -->
    <a href="password.html" class="absolute top-6 left-6 bg-white text-pink-600 px-5 py-2 rounded-full shadow-md 
            hover:bg-pink-500 hover:text-white transition duration-300 flex items-center gap-2">

        <!-- Arrow Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>

        Back
    </a>

    <!-- Video Moment Section -->
    <section class="py-10 px-10 bg-gradient-to-br from-pink-50 to-pink-100">
        <div class="max-w-xl mx-auto text-center">
            <h2 class="text-4xl md:text-5xl font-semibold text-pink-500 mb-4">
                Video Happly Birthday
            </h2>
            <p class="text-lg md:text-xl text-gray-600 mb-8">
                คลิปนี้เค้าให้เธอนะ
            </p>

            <div class="relative rounded-2xl overflow-hidden shadow-2xl mx-auto">
                <video controls class="w-full max-h-[75vh] object-contain mx-auto rounded-2xl">
                    <source src="./assets/videos/memory.mp4" type="video/mp4">
                </video>
            </div>
        </div>
    </section>
</body>

</html>
