<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="bg-pink-200 min-h-screen flex items-center justify-center">
    <!-- Back Button -->
    <a href="index.html" class="absolute top-6 left-6 bg-white text-pink-600 px-5 py-2 rounded-full shadow-md 
            hover:bg-pink-500 hover:text-white transition duration-300 flex items-center gap-2">

        <!-- Arrow Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>

        Back
    </a>

    <div class="max-w-4xl w-full px-6">

        <!-- Title -->
        <h1 class="text-4xl font-bold text-center text-pink-700 mb-10">
            My Special Menu 💕
        </h1>

        <!-- Grid -->
        <div class="grid md:grid-cols-2 gap-8">

            <!-- Gallery -->
            <a href="gallery.html"
                class="bg-white rounded-2xl shadow-lg p-10 flex flex-col items-center text-center hover:scale-105 hover:shadow-2xl transition duration-300">

                <!-- Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-pink-500 mb-4" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V7M3 7l9 6 9-6M3 7l9-4 9 4" />
                </svg>

                <h2 class="text-2xl font-semibold text-pink-600">Gallery</h2>
                <p class="text-gray-500 mt-2">Our beautiful memories together 💖</p>
            </a>

            <!-- Video -->
            <a href="video.html"
                class="bg-white rounded-2xl shadow-lg p-10 flex flex-col items-center text-center hover:scale-105 hover:shadow-2xl transition duration-300">

                <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-pink-500 mb-4" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14m-6 4h6a2 2 0 002-2V8a2 2 0 00-2-2H9a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>

                <h2 class="text-2xl font-semibold text-pink-600">Video</h2>
                <p class="text-gray-500 mt-2">Watch our lovely moments 🎥</p>
            </a>

            <!-- Voice -->
            <a href="voice.html"
                class="bg-white rounded-2xl shadow-lg p-10 flex flex-col items-center text-center hover:scale-105 hover:shadow-2xl transition duration-300">

                <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-pink-500 mb-4" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 1v11m0 0a3 3 0 003-3V4a3 3 0 10-6 0v5a3 3 0 003 3zm5 4v1a5 5 0 01-10 0v-1m5 6v4m-4 0h8" />
                </svg>

                <h2 class="text-2xl font-semibold text-pink-600">Voice</h2>
                <p class="text-gray-500 mt-2">Listen to my voice for you 🎙️</p>
            </a>

            <!-- Message -->
            <a href="message.html"
                class="bg-white rounded-2xl shadow-lg p-10 flex flex-col items-center text-center hover:scale-105 hover:shadow-2xl transition duration-300">

                <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-pink-500 mb-4" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4-.8L3 20l1.2-3.2A7.963 7.963 0 013 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>

                <h2 class="text-2xl font-semibold text-pink-600">Message</h2>
                <p class="text-gray-500 mt-2">Sweet words from my heart 💌</p>
            </a>

        </div>
    </div>

</body>

</html>
